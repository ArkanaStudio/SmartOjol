<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Ojol Smart Nav - GraphHopper Motor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
        }

        #map {
            height: 48vh;
            width: 100%;
        }

        .panel {
            padding: 15px;
            height: 52vh;
            box-sizing: border-box;
            background: #1e1e1e;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #008CBA;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:active {
            background: #005f73;
        }

        .btn-connect {
            background: #2e7d32;
        }

        .btn-connect.connected {
            background: #c62828;
        }

        .btn-clear {
            background: #d32f2f;
            display: none;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #008CBA;
        }

        .status-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 5px solid #ffa000;
            line-height: 1.4;
        }

        .status-box.active {
            border-left-color: #4caf50;
        }

        .log-box {
            background: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 6px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="panel">
        <button id="btnConnect" class="btn btn-connect">🔌 HUBUNGKAN KE STANG MOTOR</button>

        <div class="status-box" id="lblStatus">
            <strong>Status Bluetooth:</strong> Terputus<br>
            <small>Pastikan GPS & Bluetooth HP aktif!</small>
        </div>

        <div class="input-group">
            <input type="text" id="txtSearch" placeholder="Cari lokasi atau ketuk langsung di peta..." />
            <button class="btn" onclick="searchLocation()">CARI</button>
        </div>

        <button id="btnClearDest" class="btn btn-clear" onclick="clearDestination()">❌ HAPUS TUJUAN / PILIH
            ULANG</button>

        <div class="status-box" id="lblNavInfo">
            <strong>Mode GraphHopper Motor:</strong> Ketuk titik di peta untuk mulai navigasi presisi tinggi.
        </div>

        <div class="log-box" id="logBox">> Web App Siap (GraphHopper API Connected).</div>
    </div>

    <script>
        let map;
        let userMarker = null;
        let destinationMarker = null;
        let routePolyline = null; // Menyimpan garis rute dari GraphHopper

        let currentLat = -6.200000, currentLon = 106.816666;
        let targetLat = null, targetLon = null;
        let isDestinationLocked = false;

        let bluetoothDevice = null;
        let navChar = null, cmdChar = null;

        let lastRerouteTime = 0;
        const REROUTE_COOLDOWN_MS = 6000;
        const GH_API_KEY = "4c27c63b-a364-443c-84b5-7d00328be385"; // API Key GraphHopper Anda

        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const CHAR_NAV_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
        const CHAR_CMD_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

        function log(msg) {
            const logBox = document.getElementById('logBox');
            logBox.innerText += "\n> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Inisialisasi Peta Leaflet
        map = L.map('map').setView([currentLat, currentLon], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // 2. Fitur Klik Peta Sekali Sentuh Kunci Tujuan
        map.on('click', function (e) {
            if (isDestinationLocked) {
                log("Tujuan terkunci. Tekan tombol 'HAPUS TUJUAN' untuk mengganti lokasi.");
                return;
            }

            targetLat = e.latlng.lat;
            targetLon = e.latlng.lng;
            isDestinationLocked = true;

            log("Tujuan dipilih di peta. Menghitung rute GraphHopper...");

            if (destinationMarker) map.removeLayer(destinationMarker);

            destinationMarker = L.marker([targetLat, targetLon], { draggable: false }).addTo(map)
                .bindPopup("Tujuan Terkunci").openPopup();

            document.getElementById('btnClearDest').style.display = "block";
            fetchGraphHopperRoute(currentLat, currentLon, targetLat, targetLon);
        });

        function clearDestination() {
            isDestinationLocked = false;
            targetLat = null;
            targetLon = null;

            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }

            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }

            document.getElementById('btnClearDest').style.display = "none";
            document.getElementById('lblNavInfo').innerHTML = "<strong>Mode Motor:</strong> Tujuan dihapus. Ketuk peta untuk memilih lokasi baru.";
            log("Tujuan direset.");
        }

        // 3. Auto Tracking GPS Presisi Tinggi
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const newLat = pos.coords.latitude;
                const newLon = pos.coords.longitude;

                const distanceMoved = calculateDistanceMeters(currentLat, currentLon, newLat, newLon);

                currentLat = newLat;
                currentLon = newLon;

                if (!userMarker) {
                    userMarker = L.marker([currentLat, currentLon]).addTo(map).bindPopup("Posisi Anda").openPopup();
                    map.setView([currentLat, currentLon], 18);
                } else {
                    userMarker.setLatLng([currentLat, currentLon]);
                }

                // Auto-Rerouting otomatis jika bergeser > 15 meter dari jalur
                if (isDestinationLocked && targetLat && targetLon && distanceMoved > 15) {
                    const now = Date.now();
                    if (now - lastRerouteTime > REROUTE_COOLDOWN_MS) {
                        log("Pergeseran posisi terdeteksi -> Menghitung ulang jalur alternatif via GraphHopper...");
                        lastRerouteTime = now;
                        fetchGraphHopperRoute(currentLat, currentLon, targetLat, targetLon);
                    }
                }

            }, (err) => log("GPS Error: " + err.message), {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            log("Geolocation tidak didukung browser ini.");
        }

        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 4. Web Bluetooth Connection
        document.getElementById('btnConnect').addEventListener('click', async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                return;
            }

            try {
                log("Memindai perangkat BLE...");
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                navChar = await service.getCharacteristic(CHAR_NAV_UUID);
                cmdChar = await service.getCharacteristic(CHAR_CMD_UUID);

                await cmdChar.startNotifications();
                cmdChar.addEventListener('characteristicvaluechanged', (evt) => {
                    const val = new TextDecoder().decode(evt.target.value);
                    log("Notifikasi Stang: " + val);
                    if (val.includes("ALT_ROUTE") && isDestinationLocked && targetLat && targetLon) {
                        alert("Tombol ALT ditekan! Mencari jalur alternatif...");
                        fetchGraphHopperRoute(currentLat, currentLon, targetLat, targetLon);
                    }
                });

                document.getElementById('lblStatus').className = "status-box active";
                document.getElementById('lblStatus').innerHTML = "<strong>Status Bluetooth:</strong> TERHUBUNG!";
                document.getElementById('btnConnect').className = "btn btn-connect connected";
                document.getElementById('btnConnect').innerText = "❌ PUTUSKAN BLUETOOTH";
                log("BLE Terhubung 100%!");
            } catch (err) {
                log("ERROR BLE: " + err.message);
            }
        });

        function onDisconnected() {
            document.getElementById('lblStatus').className = "status-box";
            document.getElementById('lblStatus').innerHTML = "<strong>Status Bluetooth:</strong> Terputus";
            document.getElementById('btnConnect').className = "btn btn-connect";
            document.getElementById('btnConnect').innerText = "🔌 HUBUNGKAN KE STANG MOTOR";
            log("Koneksi Bluetooth terputus.");
        }

        // 5. Pencarian Lokasi Teks (Nominatim)
        async function searchLocation() {
            const q = document.getElementById('txtSearch').value;
            if (!q) return;

            log("Mencari lokasi: " + q);
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if (data.length > 0) {
                    targetLat = parseFloat(data[0].lat);
                    targetLon = parseFloat(data[0].lon);
                    isDestinationLocked = true;

                    if (destinationMarker) map.removeLayer(destinationMarker);
                    destinationMarker = L.marker([targetLat, targetLon], { draggable: false }).addTo(map)
                        .bindPopup(data[0].display_name).openPopup();
                    map.setView([targetLat, targetLon], 17);

                    document.getElementById('btnClearDest').style.display = "block";
                    fetchGraphHopperRoute(currentLat, currentLon, targetLat, targetLon);
                } else {
                    alert("Lokasi tidak ditemukan!");
                }
            } catch (e) {
                log("Search Error: " + e.message);
            }
        }

        // 6. Fungsi Utama Pengambilan Rute Pintar via GraphHopper API (Profil: Scooter/Motor)
        async function fetchGraphHopperRoute(startLat, startLon, endLat, endLon) {
            // Parameter profil 'scooter' atau 'bike' khusus motor di GraphHopper
            const url = `https://graphhopper.com/api/1/route?point=${startLat},${startLon}&point=${endLat},${endLon}&vehicle=scooter&instructions=true&locale=id&key=${GH_API_KEY}`;

            try {
                log("Meminta rute pintar dari server GraphHopper...");
                const response = await fetch(url);
                const data = await response.json();

                if (data.paths && data.paths.length > 0) {
                    const path = data.paths[0];
                    const distanceMeters = Math.round(path.distance);
                    const instructions = path.instructions[0] || { text: "Ikuti jalur utama", distance: distanceMeters };

                    const streetName = instructions.street_name || "Jalur Lingkungan / Gang";
                    const instructionText = instructions.text || "Lurus terus";
                    const stepDist = Math.round(instructions.distance);

                    document.getElementById('lblNavInfo').innerHTML =
                        `<strong>GraphHopper Motor:</strong> ${instructionText} (${stepDist}m)<br><strong>Jalur:</strong> ${streetName} (Total: ${distanceMeters}m)`;

                    // Hapus polyline rute lama jika ada
                    if (routePolyline) {
                        map.removeLayer(routePolyline);
                    }

                    // Decode Polyline koordinat jalur dari GraphHopper
                    const latLngs = decodePolyline(path.points);
                    routePolyline = L.polyline(latLngs, { color: '#ff5722', weight: 6, opacity: 0.85 }).addTo(map);

                    // Ambil sampel titik koordinat relatif untuk dikirim via BLE ke ESP32-C3
                    const pts = latLngs.slice(0, 10).map((c) => {
                        return [Math.round((c[1] - currentLon) * 10000), Math.round((c[0] - currentLat) * 10000)];
                    });

                    // Kirim data ke ESP32 via BLE
                    if (navChar && bluetoothDevice && bluetoothDevice.gatt.connected) {
                        const payload = {
                            speed: 35,
                            turn: "STRAIGHT",
                            dist: stepDist,
                            street: streetName,
                            pts: pts
                        };

                        const jsonString = JSON.stringify(payload);
                        const bleData = new TextEncoder().encode(jsonString);

                        navChar.writeValueWithoutResponse(bleData).then(() => {
                            log("Data rute GraphHopper berhasil dikirim ke ESP32!");
                        }).catch((err) => {
                            log("Gagal kirim BLE: " + err.message);
                        });
                    }

                } else {
                    alert("Gagal menghitung rute GraphHopper.");
                }
            } catch (error) {
                log("GraphHopper Error: " + error.message);
            }
        }

        // Fungsi Decoder Format Polyline Bawaan GraphHopper
        function decodePolyline(str, precision) {
            var index = 0,
                lat = 0,
                lng = 0,
                coordinates = [],
                shift = 0,
                result = 0,
                byte = null,
                latitude_change,
                longitude_change,
                factor = Math.pow(10, precision || 5);

            while (index < str.length) {
                byte = null;
                shift = 0;
                result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                latitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));

                shift = 0;
                result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                longitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));

                lat += latitude_change;
                lng += longitude_change;

                coordinates.push([lat / factor, lng / factor]);
            }
            return coordinates;
        }
    </script>
</body>

</html>
